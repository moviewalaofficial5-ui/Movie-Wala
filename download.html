<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Movie Wala | Details</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:#050708;color:#fff;min-height:100vh}a{text-decoration:none;color:inherit}.top{height:74px;background:#080a0b;border-bottom:1px solid #25292b;display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:10}.top img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid #e7ad00}.brand{font-weight:900;font-size:22px}.brand span{color:#e7ad00}.back{margin-left:auto;border:1px solid #444;padding:10px 16px;border-radius:7px;font-weight:800}main{max-width:1100px;margin:35px auto;padding:0 20px}.box{min-height:430px;border:1px solid #292d30;border-radius:14px;overflow:hidden;background:#0b0e10;display:grid;grid-template-columns:300px 1fr}.poster{width:100%;height:430px;object-fit:cover;background:#111}.content{padding:35px}.badge{display:inline-block;background:#e50914;padding:7px 11px;border-radius:5px;font-size:12px;font-weight:900;margin-bottom:14px}h1{font-size:42px;line-height:1.05;margin-bottom:12px}.meta{color:#ffc400;font-weight:800;margin-bottom:20px}.overview{color:#d8d8d8;line-height:1.7;margin-bottom:25px}h2{font-size:18px;margin:25px 0 12px}.providers{display:flex;flex-wrap:wrap;gap:10px}.provider{background:#15191b;border:1px solid #3a3f42;border-radius:7px;padding:11px 14px;font-weight:800}.note{color:#999;font-size:12px;margin-top:16px;line-height:1.5}.error{text-align:center;padding:80px 20px}.btn{display:inline-block;margin-top:18px;background:#e50914;padding:12px 18px;border-radius:7px;font-weight:900}@media(max-width:700px){.box{grid-template-columns:1fr}.poster{height:360px}.content{padding:24px}h1{font-size:32px}}
</style></head><body><header class="top"><a href="index.html"><img src="movie-wala-logo.jpeg" alt="Movie Wala"></a><a class="brand" href="index.html">MOVIE <span>WALA</span></a><a class="back" href="index.html">← BACK</a></header><main id="app"><div class="error">Loading...</div></main><script>
const BASE="https://api.themoviedb.org/3",IMG="https://image.tmdb.org/t/p/w780";const key=localStorage.getItem("movieWalaTmdbKey")||"";const q=new URLSearchParams(location.search),id=q.get("id"),type=q.get("type")==="tv"?"tv":"movie",app=document.getElementById("app");function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}async function api(path){if(!key)throw Error("KEY");const r=await fetch(BASE+path+(path.includes("?")?"&":"?")+"api_key="+encodeURIComponent(key)+"&language=en-US&region=IN");if(!r.ok)throw Error("TMDB "+r.status);return r.json()}async function load(){if(!id){app.innerHTML='<div class="error"><h2>Movie not found</h2><a class="btn" href="index.html">HOME</a></div>';return}if(!key){app.innerHTML='<div class="error"><h2>TMDB API key required</h2><p class="note">Home page par TMDB key save karo, phir yahan wapas aao.</p><a class="btn" href="index.html">← BACK TO MOVIE WALA</a></div>';return}try{const [item,p]=await Promise.all([api("/"+type+"/"+id),api("/"+type+"/"+id+"/watch/providers")]);const title=item.title||item.name||"Untitled",date=item.release_date||item.first_air_date||"",rating=item.vote_average?item.vote_average.toFixed(1):"N/A",inr=(p.results||{}).IN||{},all=[...(inr.flatrate||[]),...(inr.rent||[]),...(inr.buy||[])],seen=new Set(),providers=all.filter(x=>x.provider_id&&!seen.has(x.provider_id)&&seen.add(x.provider_id));const link=inr.link||"";app.innerHTML=`<section class="box"><img class="poster" src="${item.poster_path?IMG+item.poster_path:""}" alt="${esc(title)}"><div class="content"><span class="badge">${type==="tv"?"WEB SERIES":"MOVIE"}</span><h1>${esc(title)}</h1><div class="meta">★ ${rating} &nbsp; • &nbsp; ${date?date.slice(0,4):"N/A"}</div><p class="overview">${esc(item.overview||"No overview available.")}</p><h2>WATCH / RENT / BUY</h2><div class="providers">${providers.length?providers.map(x=>`<a class="provider" target="_blank" rel="noopener" href="${link||"https://www.google.com/search?q="+encodeURIComponent(title+" official watch")}">${esc(x.provider_name)}</a>`).join(""):"<span class="note">India ke liye official provider link TMDB par available nahi hai.</span>"}</div><p class="note">Movie Wala copyrighted movie files host nahi karta. Yahan official/legal watch, rent ya buy options diye jaate hain.</p></div></section>`}catch(e){console.error(e);app.innerHTML='<div class="error"><h2>Details load nahi ho paaye.</h2><p class="note">TMDB key check karo aur page refresh karo.</p><a class="btn" href="index.html">← BACK</a></div>'}}load();</script></body></html>
