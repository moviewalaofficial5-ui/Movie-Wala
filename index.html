<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movie Wala</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

.hero{
    width:100%;
    background:#000;
}

.slider{
    position:relative;
    width:100%;
    height:auto;
    aspect-ratio:16 / 9;
    overflow:hidden;
    background:#000;
}

/* ALL 5 BANNERS */
.slide{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    opacity:0;
    visibility:hidden;
    transition:opacity .6s ease;
}

.slide.active{
    opacity:1;
    visibility:visible;
}

/* Banner 5 ko crop nahi karna */
.slide.banner5{
    object-fit:contain;
    background:#000;
}

/* ARROWS */
.arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:20;

    width:45px;
    height:45px;

    border:none;
    border-radius:50%;

    background:rgba(0,0,0,.70);
    color:#fff;

    font-size:32px;
    line-height:45px;
    text-align:center;

    cursor:pointer;
}

.arrow:hover{
    background:#e50914;
}

.prev{
    left:15px;
}

.next{
    right:15px;
}

/* DOTS */
.dots{
    position:absolute;
    left:50%;
    bottom:12px;
    transform:translateX(-50%);

    display:flex;
    align-items:center;
    gap:7px;

    z-index:25;
}

.dot{
    width:9px;
    height:9px;

    border:0;
    border-radius:50%;

    background:#fff;
    opacity:.7;

    cursor:pointer;
    padding:0;
}

.dot.active{
    width:25px;
    border-radius:10px;
    background:#e50914;
    opacity:1;
}

/* MOBILE */
@media(max-width:600px){

    .slider{
        aspect-ratio:16 / 9;
    }

    .slide{
        object-fit:cover;
    }

    .slide.banner5{
        object-fit:contain;
    }

    .arrow{
        width:36px;
        height:36px;
        line-height:36px;
        font-size:27px;
    }

    .prev{
        left:7px;
    }

    .next{
        right:7px;
    }

    .dots{
        bottom:7px;
        gap:5px;
    }

    .dot{
        width:7px;
        height:7px;
    }

    .dot.active{
        width:20px;
    }
}
</style>
</head>

<body>

<section class="hero">

<div class="slider" id="slider">

    <!-- BANNER 1 -->
    <img
        src="banner-1.png"
        class="slide active"
        alt="Movie Wala Banner 1">

    <!-- BANNER 2 -->
    <img
        src="banner-2.png"
        class="slide"
        alt="Movie Wala Banner 2">

    <!-- BANNER 3 -->
    <img
        src="banner-3.png"
        class="slide"
        alt="Movie Wala Banner 3">

    <!-- BANNER 4 -->
    <img
        src="banner-4.jpeg"
        class="slide"
        alt="Movie Wala Banner 4">

    <!-- BANNER 5 -->
    <img
        src="Banner-5.jpeg"
        class="slide banner5"
        alt="Movie Wala Banner 5">

    <!-- PREVIOUS -->
    <button
        class="arrow prev"
        id="prev"
        type="button"
        aria-label="Previous Banner">
        ‹
    </button>

    <!-- NEXT -->
    <button
        class="arrow next"
        id="next"
        type="button"
        aria-label="Next Banner">
        ›
    </button>

    <!-- 5 DOTS -->
    <div class="dots">

        <button
            class="dot active"
            data-slide="0"
            type="button"
            aria-label="Banner 1">
        </button>

        <button
            class="dot"
            data-slide="1"
            type="button"
            aria-label="Banner 2">
        </button>

        <button
            class="dot"
            data-slide="2"
            type="button"
            aria-label="Banner 3">
        </button>

        <button
            class="dot"
            data-slide="3"
            type="button"
            aria-label="Banner 4">
        </button>

        <button
            class="dot"
            data-slide="4"
            type="button"
            aria-label="Banner 5">
        </button>

    </div>

</div>

</section>

<script>

const slides = document.querySelectorAll(".slide");
const dots = document.querySelectorAll(".dot");

const nextButton = document.getElementById("next");
const prevButton = document.getElementById("prev");
const slider = document.getElementById("slider");

let currentSlide = 0;
let autoSlideTimer;


/* SHOW SELECTED SLIDE */
function showSlide(index){

    if(index < 0){
        index = slides.length - 1;
    }

    if(index >= slides.length){
        index = 0;
    }

    slides.forEach(function(slide){
        slide.classList.remove("active");
    });

    dots.forEach(function(dot){
        dot.classList.remove("active");
    });

    slides[index].classList.add("active");
    dots[index].classList.add("active");

    currentSlide = index;
}


/* NEXT */
function nextSlide(){
    showSlide(currentSlide + 1);
}


/* PREVIOUS */
function previousSlide(){
    showSlide(currentSlide - 1);
}


/* AUTO SLIDER */
function startAutoSlide(){

    clearInterval(autoSlideTimer);

    autoSlideTimer = setInterval(function(){
        nextSlide();
    },5000);
}


/* NEXT BUTTON */
nextButton.addEventListener("click",function(){

    nextSlide();
    startAutoSlide();

});


/* PREVIOUS BUTTON */
prevButton.addEventListener("click",function(){

    previousSlide();
    startAutoSlide();

});


/* DOT BUTTONS */
dots.forEach(function(dot){

    dot.addEventListener("click",function(){

        const slideNumber =
            Number(this.getAttribute("data-slide"));

        showSlide(slideNumber);
        startAutoSlide();

    });

});


/* MOBILE SWIPE */
let touchStartX = 0;
let touchEndX = 0;

slider.addEventListener(
    "touchstart",
    function(event){

        touchStartX =
            event.changedTouches[0].screenX;

    },
    {passive:true}
);


slider.addEventListener(
    "touchend",
    function(event){

        touchEndX =
            event.changedTouches[0].screenX;

        const swipeDistance =
            touchStartX - touchEndX;

        if(Math.abs(swipeDistance) > 50){

            if(swipeDistance > 0){
                nextSlide();
            }else{
                previousSlide();
            }

            startAutoSlide();
        }

    },
    {passive:true}
);


/* START SLIDER */
showSlide(0);
startAutoSlide();

</script>

</body>
</html>
